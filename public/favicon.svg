<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Vibrant Cosmic Planet Gradient -->
    <linearGradient id="planetGrad" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="85%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Glowing Planetary Ring Gradient -->
    <linearGradient id="ringGrad" x1="6" y1="18" x2="58" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Cute Visor / Planet Highlight -->
    <linearGradient id="highlightGrad" x1="20" y1="16" x2="36" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Ring Shimmer -->
    <linearGradient id="shimmerGrad" x1="12" y1="32" x2="52" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Twinkling Background Stars (Kawaii Sparkles) -->
  <!-- Top-Right Star -->
  <path d="M 52 8 C 52 13 52 13 57 13 C 52 13 52 13 52 18 C 52 13 52 13 47 13 C 52 13 52 13 52 8 Z" fill="#fde047" />
  <circle cx="52" cy="13" r="1.2" fill="#ffffff" />

  <!-- Top-Left Star -->
  <path d="M 12 14 C 12 17.5 12 17.5 15.5 17.5 C 12 17.5 12 17.5 12 21 C 12 17.5 12 17.5 8.5 17.5 C 12 17.5 12 17.5 12 14 Z" fill="#38bdf8" />

  <!-- Bottom-Left Tiny Dot -->
  <circle cx="10" cy="46" r="1.6" fill="#fde047" />
  <!-- Bottom-Right Tiny Star -->
  <circle cx="54" cy="48" r="1.8" fill="#f472b6" />
  <circle cx="54" cy="48" r="0.8" fill="#ffffff" />

  <!-- 1. BACK HALF OF PLANETARY RING (Behind Planet) -->
  <g transform="rotate(-24 32 32)">
    <path
      d="M 4 32 A 28 8.5 0 0 1 60 32"
      stroke="url(#ringGrad)"
      stroke-width="5"
      stroke-linecap="round"
      opacity="0.95"
    />
  </g>

  <!-- 2. MAIN PLANET BODY -->
  <circle cx="32" cy="32" r="18" fill="url(#planetGrad)" />

  <!-- Planet Atmosphere Glow / Shading Ring -->
  <circle
    cx="32"
    cy="32"
    r="17"
    stroke="#ffffff"
    stroke-width="1.2"
    stroke-opacity="0.25"
    fill="none"
  />

  <!-- Sweet Glossy Highlight (Top Left curve) -->
  <ellipse cx="25" cy="21" rx="7" ry="3.5" fill="url(#highlightGrad)" transform="rotate(-28 25 21)" />
  <circle cx="35" cy="18" r="1.5" fill="#ffffff" opacity="0.6" />

  <!-- 3. FRONT HALF OF PLANETARY RING (In front of Planet) -->
  <g transform="rotate(-24 32 32)">
    <!-- Main Outer Front Ring -->
    <path
      d="M 4 32 A 28 8.5 0 0 0 60 32"
      stroke="url(#ringGrad)"
      stroke-width="5"
      stroke-linecap="round"
    />
    <!-- Ring Inner Gloss Accent -->
    <path
      d="M 9 32 A 23 6.8 0 0 0 55 32"
      stroke="url(#shimmerGrad)"
      stroke-width="1.4"
      stroke-linecap="round"
      opacity="0.85"
    />
  </g>

  <!-- 4. KAWAII FACE ELEMENTS -->
  <!-- Left Eye -->
  <ellipse cx="26" cy="32.5" rx="2.8" ry="3.2" fill="#0f172a" />
  <!-- Left Eye Sparkles -->
  <circle cx="25" cy="31.2" r="1.2" fill="#ffffff" />
  <circle cx="27.4" cy="33.6" r="0.6" fill="#ffffff" />

  <!-- Right Eye -->
  <ellipse cx="38" cy="32.5" rx="2.8" ry="3.2" fill="#0f172a" />
  <!-- Right Eye Sparkles -->
  <circle cx="37" cy="31.2" r="1.2" fill="#ffffff" />
  <circle cx="39.4" cy="33.6" r="0.6" fill="#ffffff" />

  <!-- Sweet Rosy Cheeks (Blush) -->
  <ellipse cx="21.5" cy="35.5" rx="3.2" ry="2" fill="#fb7185" opacity="0.95" />
  <ellipse cx="42.5" cy="35.5" rx="3.2" ry="2" fill="#fb7185" opacity="0.95" />

  <!-- Happy Smiling Mouth -->
  <path
    d="M 29.5 35.5 Q 32 38.5 34.5 35.5"
    stroke="#0f172a"
    stroke-width="1.8"
    stroke-linecap="round"
    fill="none"
  />
</svg>